# Deploy Flutter web → Cloudflare Worker `app_rostiq` (https://app.rostiq.co).
# Secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Account: Workers Scripts Edit; Account Settings Read
#   CLOUDFLARE_ACCOUNT_ID  — 638cfa0b7112568e5e6e47d937c9192c
#
# Deploy-only: not a required status check.

name: Deploy web

on:
  push:
    branches: [web]
  workflow_dispatch:

concurrency:
  group: deploy-web-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version pin
        id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: |
          flutter build web \
            --release \
            --dart-define=API_BASE_URL=https://api.rostiq.co \
            --base-href=/

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
